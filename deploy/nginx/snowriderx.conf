upstream snowriderx_app {
    server 127.0.0.1:8002;
    keepalive 32;
}

server {
    listen 80;
    server_name www.snowriderx.com;
    return 301 http://snowriderx.com$request_uri;
}

server {
    listen 80;
    server_name snowriderx.com 107.170.42.219;

    # Gzip — reduces HTML/CSS/JS transfer size by ~70%
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/html text/css text/plain application/javascript
               application/json application/xml image/svg+xml;

    # SSL — uncomment when domain + cert are ready
    # ssl_certificate     /etc/ssl/snowriderx/cert.pem;
    # ssl_certificate_key /etc/ssl/snowriderx/key.pem;

    # Client static assets (Tailwind CSS, JS, manifest, sw.js)
    location /static/ {
        alias /opt/snowriderx/theme/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Admin static assets
    location /admin/static/ {
        alias /opt/snowriderx/admin/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Game files — large binaries, long cache
    location /game/ {
        alias /opt/snowriderx/theme/game/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Content-Type-Options  "nosniff"                    always;
    add_header X-Frame-Options         "SAMEORIGIN"                 always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://www.googletagmanager.com https://www.google-analytics.com https://cdn.jsdelivr.net https://cdn.ckeditor.com; frame-src *; img-src * data:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.ckeditor.com https://fonts.googleapis.com; font-src 'self' https://cdn.jsdelivr.net https://cdn.ckeditor.com https://fonts.gstatic.com; connect-src 'self' https://cdn.jsdelivr.net https://cdn.ckeditor.com;" always;

    # All other requests → gunicorn
    location / {
        proxy_pass http://snowriderx_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }
}
