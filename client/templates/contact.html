{% extends "base.html" %}

{% block content %}
<div class="container" style="padding-top:1.5rem;padding-bottom:3rem;">

  {% if menu and menu.desc_m %}
  <div class="highlight article mb-5">
    {{ menu.desc_m | safe }}
  </div>
  {% endif %}

  {% if success %}
  <div style="background:#f0fff4;border:1px solid #68d391;color:#276749;border-radius:6px;padding:16px;margin-bottom:24px;">
    Thank you! Your message has been sent.
  </div>
  {% endif %}

  {% if error %}
  <div style="background:#fff5f5;border:1px solid #fc8181;color:#c53030;border-radius:6px;padding:16px;margin-bottom:24px;">
    {{ error }}
  </div>
  {% endif %}

  <form method="POST" style="max-width:600px;">
    <div aria-hidden="true" style="display:none;">
      <input type="text" name="website" tabindex="-1" autocomplete="off">
    </div>

    <div style="margin-bottom:16px;">
      <label for="name" style="display:block;font-weight:bold;margin-bottom:6px;">Name</label>
      <input type="text" id="name" name="name" required
        style="width:100%;border:1px solid #ccc;border-radius:4px;padding:8px 12px;font-size:1rem;box-sizing:border-box;">
    </div>

    <div style="margin-bottom:16px;">
      <label for="email" style="display:block;font-weight:bold;margin-bottom:6px;">Email</label>
      <input type="email" id="email" name="email" required
        style="width:100%;border:1px solid #ccc;border-radius:4px;padding:8px 12px;font-size:1rem;box-sizing:border-box;">
    </div>

    <div style="margin-bottom:16px;">
      <label for="content" style="display:block;font-weight:bold;margin-bottom:6px;">Message</label>
      <textarea id="content" name="content" rows="6" required
        style="width:100%;border:1px solid #ccc;border-radius:4px;padding:8px 12px;font-size:1rem;box-sizing:border-box;resize:vertical;"></textarea>
    </div>

    <button type="submit"
      style="background:#007bff;color:white;border:none;padding:10px 24px;border-radius:6px;font-size:1rem;font-weight:bold;cursor:pointer;">
      Send Message
    </button>
  </form>

</div>
{% endblock %}
