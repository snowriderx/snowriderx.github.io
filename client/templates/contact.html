{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-10">
  <h1 class="text-2xl font-bold mb-6">Contact Us</h1>

  {% if success %}
  <div class="bg-green-50 border border-green-300 text-green-800 rounded p-4 mb-6">
    Thank you! Your message has been sent.
  </div>
  {% endif %}

  {% if error %}
  <div class="bg-red-50 border border-red-300 text-red-800 rounded p-4 mb-6">
    {{ error }}
  </div>
  {% endif %}

  <form method="POST" class="space-y-4">
    {# Honeypot — hidden from users, bots fill it #}
    <div class="hidden" aria-hidden="true">
      <input type="text" name="website" tabindex="-1" autocomplete="off">
    </div>

    <div>
      <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Name</label>
      <input type="text" id="name" name="name" required
        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div>
      <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input type="email" id="email" name="email" required
        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div>
      <label for="content" class="block text-sm font-medium text-gray-700 mb-1">Message</label>
      <textarea id="content" name="content" rows="6" required
        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
    </div>
    <button type="submit"
      class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition-colors font-medium">
      Send Message
    </button>
  </form>
</div>
{% endblock %}
