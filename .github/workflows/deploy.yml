name: Deploy to Production

on:
  push:
    branches:
      - flask_jinja2

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/snowriderx
            git pull origin flask_jinja2
            sudo systemctl restart snowriderx
            sleep 3
            sudo systemctl is-active snowriderx && echo "✅ snowriderx is running" || echo "❌ snowriderx failed to start"
            echo "Deploy completed at $(date)"
