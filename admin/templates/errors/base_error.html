<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block error_title %}Lỗi{% endblock %} — {{ site_name }}</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
  <style>
    body.error-body {
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .error-card {
      max-width: 480px;
      width: 100%;
      text-align: center;
      padding: 2.5rem 2rem;
      border-radius: 1rem;
    }
    .error-code {
      font-size: 6rem;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #1e293b 0%, #475569 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .error-icon {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body class="error-body">
  <div class="card shadow error-card">
    <div class="card-body">
      <div class="error-icon {% block icon_color %}text-danger{% endblock %}">
        <i class="bi {% block icon %}bi-exclamation-triangle-fill{% endblock %}"></i>
      </div>
      <div class="error-code">{% block code %}{% endblock %}</div>
      <h4 class="mt-2 mb-1 fw-semibold">{% block heading %}{% endblock %}</h4>
      <p class="text-muted small mb-4">{% block description %}{% endblock %}</p>
      <div class="d-flex gap-2 justify-content-center flex-wrap">
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary btn-sm">
          <i class="bi bi-house-door me-1"></i> Về trang chủ
        </a>
        <button onclick="history.back()" class="btn btn-outline-secondary btn-sm">
          <i class="bi bi-arrow-left me-1"></i> Quay lại
        </button>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
